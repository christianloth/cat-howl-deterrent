[project]
name = "cat-howl-deterrent"
version = "0.2.0"
description = "YAMNet-based cat-howl detector with verifier-gated ultrasonic deterrent."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Christian Loth", email = "christian.loth@worlds.io" }]
license = { text = "MIT" }

dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "soundfile>=0.12",
    "tensorflow>=2.16",
    "tensorflow-hub>=0.16",
    "setuptools<81",          # tensorflow_hub still uses pkg_resources
]

[project.optional-dependencies]
# macOS: pyobjc gives us the AVFoundation bridge for triggering the mic
# permission dialog from python itself.
macos = [
    "pyobjc-core>=10.0",
    "pyobjc-framework-AVFoundation>=10.0",
]
# Apple Silicon: CoreML conversion (one-off; not needed at runtime).
coreml = [
    "coremltools>=7.2",
]
# Training / dataset prep.
training = [
    "librosa>=0.10",
    "tqdm>=4.66",
    "scikit-learn>=1.3",
    "datasets[audio]>=2.18",
]
# Everything for development on macOS.
dev = [
    "cat-howl-deterrent[macos,coreml,training]",
]

[project.scripts]
cat-howl-deterrent = "cat_howl_deterrent.cli:main"
cat-howl-request-mic = "cat_howl_deterrent.macos.mic_permission:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_howl_deterrent"]

[tool.uv]
# Reuse the existing .venv rather than recreating it.
managed = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["scripts/datasets", "scripts/training", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["cat_howl_deterrent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
